# =====================================================================
# HydroTech - Konfigurasi Eclipse Mosquitto (broker MQTT lokal)
# Dipasang oleh: sudo deploy/mosquitto/setup_mosquitto.sh
#
# KEAMANAN:
#  - autentikasi wajib (allow_anonymous false) - user esp32 & phpworker
#  - ACL membatasi topik per user (lihat file acl)
#  - akses dari luar dibatasi firewalld hanya ke subnet Wi-Fi lokal
#    192.168.1.0/24 (broker TIDAK dibuka ke internet)
# =====================================================================

# Opsi per-listener: auth + ACL berlaku untuk semua listener di bawah.
per_listener_settings true

# Dengar di semua antarmuka, port 1883 (tanpa TLS; jaringan lokal terkelola).
# Paparan ke luar dicegah firewalld (rich rule subnet lokal).
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Persistensi sesi & pesan QoS 1/2 agar perintah tidak hilang saat restart.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 30

# Log ke jurnal systemd + file (mudah diaudit saat pengujian).
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# Batas ukuran pesan: payload JSON HydroTech sangat kecil (< 512 byte).
message_size_limit 4096
