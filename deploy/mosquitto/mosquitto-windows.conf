# =====================================================================
# HydroTech - Konfigurasi Mosquitto untuk WINDOWS (pembangunan lokal)
# Salin ke: C:\Program Files\mosquitto\mosquitto.conf  (timpa yang ada)
#
# Broker LOCAL SAJA (127.0.0.1) dan anonymous agar nol konfigurasi:
# user/password apa pun dari klien lokal diterima. JANGAN dipakai
# sebagai broker produksi / dipaparkan ke luar komputer.
# =====================================================================

listener 1883 127.0.0.1
allow_anonymous true

persistence true
persistence_location C:/Program Files/mosquitto/

log_dest file C:/Program Files/mosquitto/mosquitto.log
log_type error
log_type warning
connection_messages true

message_size_limit 4096
