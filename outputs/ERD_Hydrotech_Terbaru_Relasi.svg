<text x="180" y="779" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">Maksimal satu jadwal di seluruh sistem; satu pengguna dapat dirujuk 0..1 jadwal.</text>
<text x="180" y="825" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#24333c">Satu baris anak boleh tanpa induk (FK NULL), atau merujuk tepat satu induk.</text>
