<text x="140" y="90" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="43" font-weight="bold" fill="#155e63">HYDROTECH — PENJELASAN RELASI ERD</text>
<text x="140" y="153" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">Pendamping diagram · seluruh foreign key dan aturan kardinalitas</text>
