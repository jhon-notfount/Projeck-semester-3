<text x="180" y="1439" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">Satu induk dapat dirujuk 0..N baris anak.</text>
<text x="180" y="1485" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#24333c">Satu baris anak boleh tanpa induk (FK NULL), atau merujuk tepat satu induk.</text>
<rect x="140" y="1560" width="3620" height="190" fill="#f3f8f9" stroke="#d2dfe3" stroke-width="1"/>
