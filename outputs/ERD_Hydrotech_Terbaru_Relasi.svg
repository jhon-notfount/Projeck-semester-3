<text x="180" y="1659" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">Satu induk dapat dirujuk 0..N baris anak.</text>
<text x="180" y="1705" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#24333c">Satu baris anak boleh tanpa induk (FK NULL), atau merujuk tepat satu induk.</text>
<rect x="140" y="1780" width="3620" height="190" fill="#f3f8f9" stroke="#d2dfe3" stroke-width="1"/>
<text x="180" y="1826" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#24333c">R8   notifications.id_pembacaan_ph  →  ph_readings.id_pembacaan_ph</text>
<text x="180" y="1879" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">Satu induk dapat dirujuk 0..N baris anak.</text>
<text x="180" y="1925" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#24333c">Satu baris anak boleh tanpa induk (FK NULL), atau merujuk tepat satu induk.</text>
<rect x="140" y="2000" width="3620" height="190" fill="#f3f8f9" stroke="#d2dfe3" stroke-width="1"/>
<text x="180" y="2046" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#24333c">R9   notifications.id_pembacaan_ppm  →  ppm_readings.id_pembacaan_ppm</text>
<text x="180" y="2099" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">Satu induk dapat dirujuk 0..N baris anak.</text>
<text x="180" y="2145" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#24333c">Satu baris anak boleh tanpa induk (FK NULL), atau merujuk tepat satu induk.</text>
<text x="140" y="2300" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#155e63">ATURAN REFERENSI DAN PENGHAPUSAN</text>
<text x="140" y="2370" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">R1, R2, R3: pengguna dihapus → diubah_oleh_id menjadi NULL (ON DELETE SET NULL).</text>
<text x="140" y="2440" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">R4–R9: data induk yang masih dirujuk tidak dapat dihapus (ON DELETE RESTRICT).</text>
<text x="140" y="2510" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">settings.jenis adalah UNIQUE, sehingga sah menjadi tujuan foreign key walaupun bukan primary key.</text>
<text x="140" y="2580" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">monitoring_logs: id_pembacaan_ph hanya untuk jenis ph; id_pembacaan_ppm hanya untuk jenis ppm.</text>
<text x="140" y="2650" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">Monitoring dan notifikasi tidak boleh merujuk pH dan PPM sekaligus dalam satu baris.</text>
<text x="140" y="2720" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">history_logs tidak mempunyai FK langsung ke pembacaan maupun jadwal Dithane.</text>
<text x="140" y="2790" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">diubah_oleh_id hanya menunjukkan pengubah terakhir; bukan daftar seluruh perubahan.</text>
<text x="140" y="2860" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">Garis ERD menjelaskan hubungan penyimpanan data, bukan bukti bahwa perangkat ESP32 sudah terhubung.</text>
<text x="140" y="3045" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#526670">Disusun berdasarkan skema proyek pada 29 September 2026.</text>
</svg>