<text x="180" y="946" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#24333c">R4   monitoring_logs.jenis  →  settings.jenis</text>
<text x="180" y="999" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">Satu induk dapat dirujuk 0..N baris anak.</text>
