<text x="180" y="559" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#24333c">Satu induk dapat dirujuk 0..N baris anak.</text>
<text x="180" y="605" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#24333c">Satu baris anak boleh tanpa induk (FK NULL), atau merujuk tepat satu induk.</text>
