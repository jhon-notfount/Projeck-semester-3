<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Konfirmasi Keluar</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body class="popup-body">
    <div class="logout-modal">
      <div class="brand">Hydr<span class="globe">🌐</span>tech</div>
      <p>Konfirmasi Keluar</p>
      <div
        class="avatar-big"
        style="transform:scale(.72);margin-top:18px;margin-bottom:8px"
      ></div>
      <h2>
        Apakah Anda yakin<br>
        ingin keluar?
      </h2>
      <p>
        Anda akan keluar dari akun Hydrotech Anda dan perlu masuk kembali untuk
        mengakses aplikasi.
      </p>
      <div class="logout-buttons">
        <button class="outline" onclick="window.history.back()">Batal</button>
        <button class="green-btn" onclick="window.location.href='login.html'">
          Ya, Keluar
        </button>
      </div>
      <div class="safe">
        Informasi akun Anda akan tetap aman<br>
        <b>⌂ Data tersimpan & terlindungi</b>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/confirm-modal.js"></script>
  </body>
</html>
